name: Daily Motivation

on:
  schedule:
    # 14:00 UTC = 6am/7am Pacific depending on daylight saving.
    # Edit this cron expression to change the time.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-daily-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pick today's message
        run: python scripts/daily_message.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No change today (unlikely, but nothing to commit)."
          else
            git commit -m "Daily motivation: $(date -u +%Y-%m-%d)"
            git push
          fi
