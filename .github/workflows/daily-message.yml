name: Daily Motivation

on:
  schedule:
    # Fires once a day; the job itself then makes a random number (1-10)
    # of separate commits, each with a randomly picked message.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-daily-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post a random number (1-10) of messages as separate commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COUNT=$(( (RANDOM % 10) + 1 ))
          echo "Posting $COUNT message(s) today"

          for i in $(seq 1 "$COUNT"); do
            python scripts/daily_message.py
            git add README.md
            if git diff --cached --quiet; then
              echo "No change on commit $i/$COUNT, skipping"
            else
              git commit -m "Motivation update $i/$COUNT: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            fi
          done

          git push
